name: link-check

on:
  pull_request:
    paths:
      - "**/references/links.md"
      - "**/theory/resources.md"
      - ".github/workflows/link-check.yml"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Link check
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          import requests

          # Anti-bot / method-not-allowed / gateway blips are not treated as dead links.
          SOFT_STATUSES = {401, 403, 405, 406, 429, 500, 502, 503, 504, 520, 521, 522, 523, 524, 530}
          HEADERS = {
              "User-Agent": "nan-data-engineering-labs-link-check/1.0 (+https://github.com/nanlabs/nan-data-engineering-labs)"
          }
          SKIP_HOST_PREFIXES = ("localhost", "127.0.0.1", "0.0.0.0")
          TRAILING_PUNCT = "\"'`.,;:)]}>"

          errors = []
          soft = []
          skipped = 0
          checked = 0

          def normalize(url: str) -> str:
              return url.rstrip(TRAILING_PUNCT)

          def check(url: str) -> tuple[str, str | int]:
              try:
                  r = requests.head(url, timeout=15, allow_redirects=True, headers=HEADERS)
                  if r.status_code < 400:
                      return "ok", r.status_code
                  if r.status_code in SOFT_STATUSES:
                      return "soft", r.status_code
                  # Some hosts reject HEAD; retry with GET.
                  r = requests.get(url, timeout=15, allow_redirects=True, headers=HEADERS, stream=True)
                  r.close()
                  if r.status_code < 400:
                      return "ok", r.status_code
                  if r.status_code in SOFT_STATUSES:
                      return "soft", r.status_code
                  return "hard", r.status_code
              except requests.exceptions.SSLError as exc:
                  return "soft", f"ssl:{exc.__class__.__name__}"
              except requests.exceptions.ConnectionError as exc:
                  # DNS failures / refused connections for external docs are often flaky.
                  msg = str(exc)
                  if "NameResolutionError" in msg or "Failed to resolve" in msg:
                      return "soft", "dns"
                  return "hard", msg
              except Exception as exc:  # noqa: BLE001
                  return "hard", str(exc)

          for pattern in ["**/references/links.md", "**/theory/resources.md"]:
              for path in pathlib.Path(".").glob(pattern):
                  text = path.read_text(encoding="utf-8")
                  urls = re.findall(r"https?://[^\s)>\]]+", text)
                  for raw in urls:
                      url = normalize(raw)
                      host = re.sub(r"^https?://", "", url).split("/", 1)[0].lower()
                      if host.startswith(SKIP_HOST_PREFIXES):
                          skipped += 1
                          continue
                      checked += 1
                      kind, detail = check(url)
                      if kind == "hard":
                          errors.append(f"{path}: {url} -> {detail}")
                      elif kind == "soft":
                          soft.append(f"{path}: {url} -> {detail}")

          print(
              f"Checked {checked} URLs ({len(errors)} hard failures, {len(soft)} soft/blocked, {skipped} skipped)"
          )
          if soft:
              print("Soft failures (ignored):")
              for item in soft:
                  print(f"  {item}")
          if errors:
              print("Broken links found:")
              for item in errors:
                  print(f"  {item}")
              sys.exit(1)
          print("All links OK")
          PY
